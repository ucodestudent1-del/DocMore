version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: everyday
      POSTGRES_PASSWORD: everyday
      POSTGRES_DB: everyday
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everyday -d everyday"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://everydoc:everydoc@postgres:5432/everydoc
      - MAX_FILE_SIZE=52428800
      - SECRET_KEY=change-me-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - PORT=8000
      - STORAGE_BACKEND=local
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - AWS_ACCESS_KEY_ID=
      - AWS_SECRET_ACCESS_KEY=
      - AWS_S3_BUCKET=everydoc-uploads
      - AWS_S3_REGION=us-east-1
      - AWS_S3_ENDPOINT_URL=
      - FRONTEND_URL=http://localhost:3000
      - STRIPE_SECRET_KEY=
      - STRIPE_WEBHOOK_SECRET=
      - SENDGRID_API_KEY=
      - SENDGRID_FROM_EMAIL=noreply@everydoc.app
      - RETENTION_HOURS=24
      - MAX_BATCH_FILES=20
      - PROCESSING_TIMEOUT=300
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  clamav:
    image: mkodockx/docker-clamav:latest
    environment:
      - CLAMD_LISTEN_ADDR=0.0.0.0
      - CLAMD_LISTEN_PORT=3310
    ports:
      - "3310:3310"
    restart: unless-stopped

  worker:
    build: .
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://everydoc:everydoc@postgres:5432/everydoc
      - MAX_FILE_SIZE=52428800
      - SECRET_KEY=change-me-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - STORAGE_BACKEND=local
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - RETENTION_HOURS=24
      - MAX_BATCH_FILES=20
      - PROCESSING_TIMEOUT=300
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    command: sh -c "cd /app/backend && celery -A app.celery_app worker --loglevel=info --concurrency=2"

volumes:
  postgres_data:
