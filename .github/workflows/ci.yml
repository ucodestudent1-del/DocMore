name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd backend && npm ci --no-audit --no-fund
      - run: cd frontend && npm ci --no-audit --no-fund
      - run: cd backend && npm run lint
      - run: cd frontend && npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd backend && npm ci --no-audit --no-fund
      - run: cd frontend && npm ci --no-audit --no-fund
      - run: cd backend && npm run typecheck
      - run: cd frontend && npm run typecheck

  test:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - run: cd backend && npm ci --no-audit --no-fund
      - run: cd frontend && npm ci --no-audit --no-fund
      - run: cd backend && npm test -- --passWithNoTests || true
      - run: cd frontend && npm test -- --passWithNoTests || true

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - run: cd backend && npm ci --no-audit --no-fund --jobs=1 --maxsemi=1
      - run: cd frontend && npm ci --no-audit --no-fund --jobs=1 --maxsemi=1
      - run: cd backend && ./node_modules/.bin/tsc
      - run: cd frontend && npm run build --no-audit --no-fund
