[build]
builder = "DOCKERFILE"
dockerfilePath = "./Dockerfile"

[deploy]
startCommand = "sh -c 'cd /app/backend && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/api/health"
restartPolicyType = "always"
restartPolicyMaxRetries = 10

[env]
REDIS_URL = "redis://redis:6379/0"
DATABASE_URL = "postgresql+asyncpg://everydoc:everydoc@postgres:5432/everydoc"
MAX_FILE_SIZE = "52428800"
SECRET_KEY = "change-me-in-production"
ALGORITHM = "HS256"
ACCESS_TOKEN_EXPIRE_MINUTES = "30"
REFRESH_TOKEN_EXPIRE_DAYS = "7"
PORT = "8000"
STORAGE_BACKEND = "local"
CLAMAV_HOST = "clamav"
CLAMAV_PORT = "3310"
AWS_ACCESS_KEY_ID = ""
AWS_SECRET_ACCESS_KEY = ""
AWS_S3_BUCKET = "everydoc-uploads"
AWS_S3_REGION = "us-east-1"
AWS_S3_ENDPOINT_URL = ""
FRONTEND_URL = "http://localhost:3000"
STRIPE_SECRET_KEY = ""
STRIPE_WEBHOOK_SECRET = ""
SENDGRID_API_KEY = ""
SENDGRID_FROM_EMAIL = "noreply@everydoc.app"
RETENTION_HOURS = "24"
MAX_BATCH_FILES = "20"
PROCESSING_TIMEOUT = "300"
